<!doctype html>
<html lang="ar" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="تفاصيل الأخبار الاقتصادية - AT Financial"
    >

    <title>تفاصيل الخبر - AT Financial</title>


    <!-- Font Awesome -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    >


    <!-- Cairo -->
    <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap"
    >


    <!-- Main CSS -->
    <link
        rel="stylesheet"
        href="css/main.css"
    >


    <!-- News CSS -->
    <link
        rel="stylesheet"
        href="css/pages/news.css"
    >


    <!-- News Detail CSS -->
    <link
        rel="stylesheet"
        href="css/pages/news-detail.css"
    >

</head>


<body>

    <main class="main-content news-detail-page">

        <!-- =====================================================
             رأس الصفحة
        ====================================================== -->

        <header class="page-header">

            <div class="header-content">

                <div class="header-left">

                    <h1 class="page-title">
                        📰 تفاصيل الخبر
                    </h1>

                    <p class="page-subtitle">
                        قراءة الخبر والانتقال إلى المصدر الأصلي
                    </p>

                </div>


                <a
                    class="detail-back-link"
                    href="news.html"
                >
                    <i class="fas fa-arrow-right"></i>

                    العودة للأخبار
                </a>

            </div>

        </header>


        <!-- =====================================================
             محتوى الخبر
             
             مهم:
             لا نضع هنا عنوان "تفاصيل الخبر"
             ولا صورة
             ولا عنوان المقال
             لأن JavaScript هو المسؤول عن بناء كل ذلك.
        ====================================================== -->

        <section class="page-content">

            <article
                id="newsDetail"
                class="news-detail-card"
            >

                <!-- حالة التحميل فقط -->

                <div class="loading-spinner">

                    <i class="fas fa-spinner fa-spin"></i>

                    <span>
                        جاري تحميل تفاصيل الخبر...
                    </span>

                </div>

            </article>

        </section>

    </main>


    <!-- =====================================================
         JavaScript
    ====================================================== -->

    <script
        type="module"
        src="js/pages/news-detail.js"
    ></script>

</body>

</html>
